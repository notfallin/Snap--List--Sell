<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snap List Sell</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f4ef;
  color: #2d2926;
}

.header {
  text-align: center;
  padding: 38px 20px 20px;
}

.logo {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 1px;
}

.tagline {
  margin-top: 8px;
  font-size: 16px;
  color: #706963;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.snap-button {
  width: 100%;
  border: none;
  border-radius: 24px;
  padding: 28px 20px;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
  background: #2d2926;
  color: white;
  box-shadow: 0 8px 20px rgba(0,0,0,.12);
}

.snap-button span {
  display: block;
  font-size: 48px;
  margin-bottom: 8px;
}

.photo-button {
  width: 100%;
  margin-top: 14px;
  padding: 18px;
  border-radius: 18px;
  border: 2px solid #d5cec5;
  background: white;
  font-size: 18px;
  font-weight: bold;
}

.section {
  margin-top: 25px;
  display: grid;
  gap: 12px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,.06);
}

.small {
  display: block;
  margin-top: 5px;
  font-size: 14px;
  font-weight: normal;
  color: #77706a;
}
</style></head><body><div class="header">
  <div class="logo">SNAP LIST SELL</div>
  <div class="tagline">Snap it. We'll do the rest.</div>
</div><div class="container">  <button class="snap-button">
    <span>📸</span>
    SNAP IT
  </button>  <button class="photo-button">
    🖼️ USE A PHOTO
  </button>  <div class="section"><div class="card">
  📦 MY ITEMS
  <span class="small">Everything you've photographed and researched.</span>
</div>

<div class="card">
  🏷️ MY LISTINGS
  <span class="small">Items ready to sell or already listed.</span>
</div>

<div class="card">
  💰 SOLD
  <span class="small">See what you've sold and what you made.</span>
</div>

<div class="card">
  ❤️ MY COLLECTION
  <span class="small">Things you decided to keep.</span>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

<script>
const photoInput = document.getElementById('photoInput');

document.querySelector('.photo-button').addEventListener('click', function() {
  photoInput.click();
});

photoInput.addEventListener('change', function() {
  if (this.files && this.files[0]) {
    alert('Photo selected! Next, we will add item identification and value estimation.');
  }
});
</script>

  </div></div></body>
</html>
